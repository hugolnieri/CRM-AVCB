# Levanta as empresas da regiao a partir do dump do CNPJ e grava em
# `public.prospeccao`. Roda quando alguem pede, nao sozinho.
#
# Nao ha `schedule` de proposito: sao ~27 GB e horas de execucao por rodada, e a
# Receita republica o cadastro uma vez por mes. Coletar sem alguem esperando o
# resultado gasta a cota do Actions para encher uma tela que ninguem vai abrir
# naquele momento. Quem vai prospectar dispara antes de comecar.
#
# SEGURANCA, e o repositorio e publico:
#
# - O unico gatilho e `workflow_dispatch`. NAO existe `pull_request`: um PR vindo
#   de fork nao pode disparar este workflow, que e como os segredos ficariam
#   expostos a quem abrisse um PR.
# - Nao usa a service role. A conta do robo e um usuario comum do sistema, e a
#   RLS vale para ela como vale para qualquer colaborador. Se o segredo vazar, o
#   estrago e o de um colaborador -- nao o de quem ignora RLS por completo.
#
# Segredos a cadastrar em Settings > Secrets and variables > Actions:
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
#   PROSPECCAO_BOT_EMAIL, PROSPECCAO_BOT_SENHA

name: Prospeccao

on:
  workflow_dispatch:
    inputs:
      camadas:
        description: "Camadas da regiao (vizinhas, sorocaba, ampliada)"
        default: "vizinhas"
      partes:
        description: "Partes do dump (0-9). Vazio = todas (~27 GB). Use 0 para testar."
        default: ""

jobs:
  coletar:
    runs-on: ubuntu-latest
    # Sao ~27 GB transmitidos e dezenas de milhoes de linhas. O padrao de 6 h
    # costuma bastar; 5 h e o teto explicito para o job nao ficar pendurado.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Coletar e gravar
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PROSPECCAO_BOT_EMAIL: ${{ secrets.PROSPECCAO_BOT_EMAIL }}
          PROSPECCAO_BOT_SENHA: ${{ secrets.PROSPECCAO_BOT_SENHA }}
        run: |
          node scripts/prospectar.mjs \
            --camadas "${{ inputs.camadas || 'vizinhas' }}" \
            ${{ inputs.partes && format('--partes {0}', inputs.partes) || '' }}
